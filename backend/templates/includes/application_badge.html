{% load i18n %}{# Small status pill for an application. Needs: app. An accepted application shows "Accepted". #}
<span class="shrink-0 px-2 py-0.5 rounded-full border font-label-caps text-label-caps uppercase whitespace-nowrap
  {% if app.is_accepted %}bg-[#10B981]/10 border-[#10B981]/20 text-[#065F46]{% elif app.status == 'PAID' %}bg-[#10B981]/10 border-[#10B981]/20 text-[#065F46]{% elif app.status == 'UNPAID' %}bg-[#DC2626]/10 border-[#DC2626]/20 text-[#991B1B]{% else %}bg-[#F59E0B]/10 border-[#F59E0B]/20 text-[#92400E]{% endif %}">{% if app.is_accepted %}{% trans "Accepted" %}{% else %}{{ app.get_status_display }}{% endif %}</span>
