{# Five stars, the first `rating` filled. Needs: rating (number). #}
<span class="inline-flex items-center" role="img" aria-label="{{ rating }}/5">{% for value in "12345" %}<span class="material-symbols-outlined text-[18px] {% if value|add:0 <= rating|add:0 %}text-[#f9a825]{% else %}text-outline-variant{% endif %}" style="font-variation-settings: 'FILL' 1;" aria-hidden="true">star</span>{% endfor %}</span>
