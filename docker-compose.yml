

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ipt_marketplace
      POSTGRES_USER: ipt
      POSTGRES_PASSWORD: ipt_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  web:
    build: .
    command: sh -c "cd backend && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=ipt
      - DB_PASSWORD=ipt_dev_password
      - DB_NAME=ipt_marketplace
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - FASTAPI_URL=http://realtime:8001
      - DJANGO_ENV=dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  realtime:
    build: .
    command: sh -c "cd realtime && uvicorn main:app --host 0.0.0.0 --port 8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      - redis

  celery_worker:
    build: .
    command: sh -c "cd backend && celery -A config worker --loglevel=info"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=ipt
      - DB_PASSWORD=ipt_dev_password
      - DB_NAME=ipt_marketplace
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_ENV=dev
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: sh -c "cd backend && celery -A config beat --loglevel=info"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=ipt
      - DB_PASSWORD=ipt_dev_password
      - DB_NAME=ipt_marketplace
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_ENV=dev
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:

